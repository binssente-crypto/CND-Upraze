services:

  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cnd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cnd_upraze
      POSTGRES_USER: cnd_user
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnd_user -d cnd_upraze"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Queue / Cache) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cnd_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Laravel Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: cnd_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/.env:/var/www/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cnd_upraze
      DB_USERNAME: cnd_user
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Laravel Queue Worker ─────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: cnd_worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=60
    volumes:
      - ./backend:/var/www
    depends_on:
      - backend
      - redis

  # ── Nginx (reverse proxy) ────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: cnd_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  # ── React Frontend (dev server) ──────────────────────────
  frontend:
    image: node:20-alpine
    container_name: cnd_frontend
    working_dir: /app
    command: sh -c "[ -d node_modules ] || npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://127.0.0.1:8000/api

volumes:
  postgres_data:
