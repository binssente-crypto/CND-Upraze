services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/ssl/certs:ro

  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}   # from .env
    volumes:
      - /data/postgres:/var/lib/postgresql/data  # host mount for persistence
